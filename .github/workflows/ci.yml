name: ViewW CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:
    inputs:
      legs:
        description: "CI legs to run"
        required: false
        default: "hosted"
        type: choice
        options:
          - hosted
          - all
          - none

      rerun:
        description: "Rerun mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - failed

      scope:
        description: "CI scope"
        required: false
        default: "gate"
        type: choice
        options:
          - gate
          - checks
          - screenshots

      package:
        description: "Build packages"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: vieww-ci-${{ github.ref }}
  cancel-in-progress: true


# ============================================================================
# VIEWW CI
#
# GitHub-hosted validation:
#
#   Linux CPU
#   Windows CPU
#   macOS CPU
#   macOS GPU / graphics path
#
# Intentionally disabled:
#
#   Linux GPU
#   Windows GPU
#
# Linux/Windows GPU certification is performed locally on real GPU hardware.
# ============================================================================


jobs:

  # ==========================================================================
  # PLAN
  # ==========================================================================

  plan:
    name: Plan CI matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Generate CI matrix
        id: matrix
        shell: bash
        env:
          REQUESTED_LEGS: ${{ github.event_name == 'workflow_dispatch' && inputs.legs || 'hosted' }}
          REQUESTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'gate' }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          requested_legs = os.environ.get("REQUESTED_LEGS", "hosted")
          requested_scope = os.environ.get("REQUESTED_SCOPE", "gate")

          legs = [

              # ============================================================
              # LINUX CPU
              # ============================================================

              {
                  "id": "linux-cpu",
                  "os": "linux",
                  "runner": "ubuntu-latest",
                  "mode": "cpu",
                  "gpu": False,
                  "hosted": True,
                  "headless": True,
                  "disabled": False,
                  "export": True,
              },

              # ============================================================
              # LINUX GPU
              #
              # Disabled in GitHub CI.
              # Run locally on real Linux GPU hardware.
              # ============================================================

              {
                  "id": "linux-gpu",
                  "os": "linux",
                  "runner": "local-linux-gpu",
                  "mode": "gpu",
                  "gpu": True,
                  "hosted": False,
                  "headless": False,
                  "disabled": True,
                  "export": False,
                  "vk_device": "nvidia",
              },

              # ============================================================
              # WINDOWS CPU
              # ============================================================

              {
                  "id": "windows-cpu",
                  "os": "windows",
                  "runner": "windows-latest",
                  "mode": "cpu",
                  "gpu": False,
                  "hosted": True,
                  "headless": True,
                  "disabled": False,
                  "export": True,
              },

              # ============================================================
              # WINDOWS GPU
              #
              # Disabled in GitHub CI.
              # Run locally on real Windows GPU hardware.
              # ============================================================

              {
                  "id": "windows-gpu",
                  "os": "windows",
                  "runner": "local-windows-gpu",
                  "mode": "gpu",
                  "gpu": True,
                  "hosted": False,
                  "headless": False,
                  "disabled": True,
                  "export": False,
                  "vk_device": "d3d12",
              },

              # ============================================================
              # macOS CPU
              # ============================================================

              {
                  "id": "macos-cpu",
                  "os": "macos",
                  "runner": "macos-latest",
                  "mode": "cpu",
                  "gpu": False,
                  "hosted": True,
                  "headless": True,
                  "disabled": False,
                  "export": True,
              },

              # ============================================================
              # macOS GPU / GRAPHICS
              #
              # This is NOT a larger GPU runner.
              # It runs on GitHub-hosted macOS hardware.
              # ============================================================

              {
                  "id": "macos-gpu",
                  "os": "macos",
                  "runner": "macos-latest",
                  "mode": "gpu",
                  "gpu": True,
                  "hosted": True,
                  "headless": False,
                  "disabled": False,
                  "export": False,
              },
          ]

          # ----------------------------------------------------------------
          # Select requested legs
          # ----------------------------------------------------------------

          selected = []

          for leg in legs:

              if leg.get("disabled", False):
                  continue

              if requested_scope == "screenshots":
                  if leg["mode"] != "cpu":
                      continue

              if requested_legs == "none":
                  continue

              if requested_legs == "hosted":
                  if not leg["hosted"]:
                      continue

              if requested_legs == "all":
                  if not leg["hosted"]:
                      continue

              selected.append(leg)

          # ----------------------------------------------------------------
          # Avoid an empty matrix.
          # ----------------------------------------------------------------

          if not selected:
              selected = [
                  {
                      "id": "noop",
                      "os": "linux",
                      "runner": "ubuntu-latest",
                      "mode": "cpu",
                      "gpu": False,
                      "hosted": True,
                      "headless": True,
                      "disabled": False,
                      "export": False,
                      "noop": True,
                  }
              ]

          matrix = {
              "include": selected
          }

          print("matrix=" + json.dumps(matrix))
          PY


  # ==========================================================================
  # MAIN VIEWW GATE
  # ==========================================================================

  gate:
    name: ${{ matrix.id }}

    needs:
      - plan

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    timeout-minutes: 350

    defaults:
      run:
        shell: bash

    env:
      CARGO_TERM_COLOR: always

      SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'gate' }}

      PACKAGE: >-
        ${{
          github.event_name != 'workflow_dispatch' ||
          inputs.package == true
          && 'true' || 'false'
        }}

      VIEWW_CERT_NO_DESKTOP: ${{ matrix.headless && '1' || '' }}

      VIEWW_VK_DEVICE: ${{ matrix.vk_device || '' }}

      VIEWW_TIMINGS_ADVISORY: ""


    steps:

      # ======================================================================
      # CHECKOUT
      # ======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false


      # ======================================================================
      # HOST INFORMATION
      # ======================================================================

      - name: Host information
        shell: bash
        run: |
          echo "=============================================="
          echo "ViewW CI"
          echo "=============================================="

          echo "Leg       : ${{ matrix.id }}"
          echo "OS        : ${{ matrix.os }}"
          echo "Mode      : ${{ matrix.mode }}"
          echo "GPU       : ${{ matrix.gpu }}"
          echo "Runner    : ${{ matrix.runner }}"
          echo "Headless  : ${{ matrix.headless }}"
          echo "Scope     : ${SCOPE}"
          echo "Package   : ${PACKAGE}"

          echo
          echo "System:"
          uname -a || true

          echo
          echo "Architecture:"
          uname -m || true

          echo
          echo "Rust:"
          rustc --version || true

          echo
          echo "Cargo:"
          cargo --version || true

          echo
          echo "Disk:"
          df -h || true


      # ======================================================================
      # LINUX DEPENDENCIES
      # ======================================================================

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libudev-dev \
            python3 \
            python3-pip \
            vulkan-tools \
            vulkan-validationlayers

          echo
          echo "Vulkan:"
          vulkaninfo --summary || true


      # ======================================================================
      # WINDOWS INFORMATION
      # ======================================================================

      - name: Windows environment
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -eux

          cmd.exe /c ver || true

          echo
          echo "PowerShell:"
          pwsh -NoProfile -Command '$PSVersionTable'

          echo
          echo "Graphics adapters:"
          pwsh -NoProfile -Command \
            "Get-CimInstance Win32_VideoController |
             Select-Object Name,DriverVersion"


      # ======================================================================
      # macOS INFORMATION
      # ======================================================================

      - name: macOS environment
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -eux

          sw_vers

          echo
          echo "Hardware:"
          system_profiler SPHardwareDataType

          echo
          echo "Graphics:"
          system_profiler SPDisplaysDataType


      # ======================================================================
      # macOS GRAPHICS / VULKAN
      # ======================================================================

      - name: macOS graphics environment
        if: matrix.os == 'macos' && matrix.gpu
        shell: bash
        run: |
          set -eux

          if command -v brew >/dev/null 2>&1; then
            brew install molten-vk vulkan-loader vulkan-tools || true
          fi

          echo
          echo "Vulkan:"
          vulkaninfo --summary || true


      # ======================================================================
      # GPU INFORMATION
      # ======================================================================

      - name: GPU environment
        if: matrix.gpu
        shell: bash
        run: |
          echo "=============================================="
          echo "GPU / GRAPHICS ENVIRONMENT"
          echo "=============================================="

          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          fi

          if command -v vulkaninfo >/dev/null 2>&1; then
            echo
            vulkaninfo --summary || true
          fi


      # ======================================================================
      # RUST TOOLCHAIN
      # ======================================================================

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eux

          rustup toolchain install

          rustup component add rustfmt
          rustup component add clippy
          rustup component add llvm-tools-preview

          rustc --version
          cargo --version


      # ======================================================================
      # CARGO DENY
      # ======================================================================

      - name: Install cargo-deny
        shell: bash
        run: |
          set -eux

          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi

          cargo deny --version


      # ======================================================================
      # WINDOWS WIX
      # ======================================================================

      - name: Install WiX
        if: matrix.os == 'windows' && matrix.mode == 'cpu'
        shell: bash
        run: |
          set -eux

          dotnet tool install --global wix --version 5.0.2 || \
            dotnet tool update --global wix --version 5.0.2

          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

          wix --version


      # ======================================================================
      # JAVA
      # ======================================================================

      - name: Setup Java
        if: matrix.export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================================
      # GRADLE
      # ======================================================================

      - name: Setup Gradle
        if: matrix.export
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ======================================================================
      # CARGO NDK
      # ======================================================================

      - name: Install cargo-ndk
        if: matrix.export
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk


      # ======================================================================
      # ANDROID ENVIRONMENT
      # ======================================================================

      - name: Android environment
        if: matrix.export
        shell: bash
        run: |
          set -eux

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-}"


      # ======================================================================
      # COMPLETE VIEWW GATE
      # ======================================================================

      - name: Run complete ViewW gate
        if: env.SCOPE == 'gate' && !matrix.noop
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "target/release-gate/${{ matrix.id }}"

          args=(
            --mode "${{ matrix.mode }}"
            --out "target/release-gate/${{ matrix.id }}"
          )

          if [[ "${PACKAGE}" != "true" ]]; then
            args+=(--skip-package)
          fi

          echo "=============================================="
          echo "VIEWW RELEASE GATE"
          echo "=============================================="
          echo "Platform : ${{ matrix.os }}"
          echo "Mode     : ${{ matrix.mode }}"
          echo "GPU      : ${{ matrix.gpu }}"
          echo "Package  : ${PACKAGE}"
          echo "=============================================="

          bash ci/vieww gate "${args[@]}"


      # ======================================================================
      # CHECKS MODE
      # ======================================================================

      - name: Run ViewW checks
        if: env.SCOPE == 'checks' && matrix.mode == 'cpu' && !matrix.noop
        shell: bash
        run: |
          set -eux

          bash ci/vieww checks


      # ======================================================================
      # SCREENSHOTS
      # ======================================================================

      - name: Generate screenshots
        if: |
          always() &&
          !matrix.noop &&
          (
            env.SCOPE == 'gate' ||
            env.SCOPE == 'screenshots'
          ) &&
          matrix.mode == 'cpu'
        shell: bash
        continue-on-error: true
        run: |
          bash ci/tools/screenshots.sh \
            "target/screenshots/${{ matrix.id }}"


      # ======================================================================
      # UPLOAD SCREENSHOTS
      # ======================================================================

      - name: Upload screenshots
        if: |
          always() &&
          !matrix.noop &&
          (
            env.SCOPE == 'gate' ||
            env.SCOPE == 'screenshots'
          ) &&
          matrix.mode == 'cpu'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.id }}
          path: target/screenshots/${{ matrix.id }}
          retention-days: 30
          if-no-files-found: warn


      # ======================================================================
      # FAILURE REPORT
      # ======================================================================

      - name: Generate failure report
        if: always() && env.SCOPE == 'gate' && !matrix.noop
        shell: bash
        run: |
          set +e

          run="target/release-gate/${{ matrix.id }}"

          if [[ ! -f "$run/rows.tsv" ]]; then
            echo "No rows.tsv found."
            exit 0
          fi

          python3 \
            ci/release/report-failures.py \
            "$run" \
            -o "$run/FAILURES.md" || true

          if [[ -f "$run/FAILURES.md" ]]; then
            cat "$run/FAILURES.md"

            {
              echo "# ${{ matrix.id }}"
              cat "$run/FAILURES.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi


      # ======================================================================
      # UPLOAD GATE EVIDENCE
      # ======================================================================

      - name: Upload gate evidence
        if: always() && env.SCOPE == 'gate' && !matrix.noop
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.id }}
          path: target/release-gate/${{ matrix.id }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn


      # ======================================================================
      # UPLOAD INSTALLERS
      # ======================================================================

      - name: Upload installers
        if: |
          always() &&
          env.SCOPE == 'gate' &&
          env.PACKAGE == 'true' &&
          matrix.mode == 'cpu' &&
          !matrix.noop
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          path: |
            target/package/viewwstudio-*
            target/package/SHA256SUMS
            target/package/MANIFEST.txt
          retention-days: 30
          if-no-files-found: warn


  # ==========================================================================
  # MERGED CHECKLIST
  # ==========================================================================

  checklist:
    name: Build merged release checklist

    needs:
      - gate

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: Download gate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: runs
          merge-multiple: false


      - name: Build merged checklist
        shell: bash
        run: |
          set -e

          mkdir -p logs

          echo "=============================================="
          echo "VIEWW RELEASE CHECKLIST"
          echo "=============================================="

          python3 \
            ci/release/fill-checklist.py \
            runs \
            -o CHECKLIST-ci.md || true

          python3 \
            ci/release/report-failures.py \
            runs \
            -o FAILURES.md || true

          echo
          echo "----------------------------------------------"
          echo "CHECKLIST"
          echo "----------------------------------------------"

          cat CHECKLIST-ci.md || true

          echo
          echo "----------------------------------------------"
          echo "FAILURES"
          echo "----------------------------------------------"

          cat FAILURES.md || true

          {
            echo "# ViewW CI Release Checklist"
            echo
            cat CHECKLIST-ci.md || true
            echo
            echo "# Failures"
            cat FAILURES.md || true
          } >> "$GITHUB_STEP_SUMMARY"


      # ======================================================================
      # UPLOAD CHECKLIST
      # ======================================================================

      - name: Upload release checklist
        uses: actions/upload-artifact@v4
        with:
          name: vieww-release-checklist
          path: |
            CHECKLIST-ci.md
            FAILURES.md
            logs/
          retention-days: 30
          if-no-files-found: warn


      # ======================================================================
      # SUMMARY
      # ======================================================================

      - name: CI matrix summary
        shell: bash
        run: |
          {
            echo
            echo "## ViewW CI Matrix"
            echo
            echo "| Platform | CPU | GPU |"
            echo "|---|---:|---:|"
            echo "| Linux | ✅ GitHub-hosted | ⏸️ Local |"
            echo "| Windows | ✅ GitHub-hosted | ⏸️ Local |"
            echo "| macOS | ✅ GitHub-hosted | ✅ GitHub-hosted |"
            echo
            echo "Linux GPU and Windows GPU are intentionally excluded from GitHub CI."
            echo "Run those two certifications locally before release sign-off."
          } >> "$GITHUB_STEP_SUMMARY"