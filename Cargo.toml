[workspace.package]
# 0.1.0, up from 0.0.1, and the difference is a claim rather than a counter.
#
# 0.0.x says "this is a placeholder"; it is what a workspace carries while it
# is deciding what it is. This one has decided: the layering is settled and
# enforced by the dependency graph, the widget catalogue is stable enough that
# `#[widget]` could be added without touching a single widget, and
# `TRACKER.md` can say crate by crate what is tested and what is not.
#
# 0.1.0 is emphatically **not** a promise of stability — semver's rules for
# 0.x mean a minor bump may break anything, and it will. It is a promise that
# the thing has a shape worth depending on and a changelog worth reading.
#
# What it is not a claim about: cross-platform GPU completeness (the Vulkan
# SceneRenderer is real but still has explicit offscreen-compositor gaps — see
# `vieww_gpu::ScenePlan::is_complete`),
# platforms other than Linux (real code, never built on their own toolchains),
# and the web backend (never compiled at all, and `publish = false` for
# exactly that reason).
version = "0.1.0"
edition = "2021"
# **1.89, because that is what the dependency tree actually requires.**
#
# This said 1.85 and it was not true. `cargo check` on 1.85 refuses outright:
#
#     cosmic-text@0.19.0 requires rustc 1.89
#     smol_str@0.3.6     requires rustc 1.89
#     image@0.25.10      requires rustc 1.88.0
#     naga@29.0.4        requires rustc 1.87
#     zbus/zvariant/…    requires rustc 1.87
#
# `cosmic-text` is the text stack — not optional, not a dev-dependency, not
# behind a feature. So no consumer has ever been able to build this workspace on
# 1.85, and `rust-version` was telling crates.io otherwise. An unverified MSRV is
# the same class of mistake as the `repository` field this file already declines
# to guess at: a wrong value is worse than no value, because someone believes it.
#
# The number is the maximum over the whole tree, so it moves when a dependency's
# does. `ci/check/checks.sh` reads it from here and `.github/workflows/ci.yml` installs
# whatever it reads — neither hard-codes a version any more, so the three cannot
# drift apart again.
#
# **Lowering it is real work, not a smaller number.** It means pinning
# `cosmic-text`, `image` and `naga` back to releases that predate their bumps,
# and living on those. Worth doing only if someone actually needs 1.85; nobody
# has asked, and until they do this is the honest figure.
rust-version = "1.89"
license = "Apache-2.0"
# `repository` is deliberately absent, decided 2026-08-17. It pointed at
# `https://github.com/teja/vieww`, which 404s, and this checkout has no remote —
# so publishing would have put a dead link on twelve crate pages. crates.io does
# not verify the field, which is exactly why an unverified wrong value is worse
# than no value: a reader who clicks it learns the project is abandoned.
#
# **To restore it**, add the line back here and `repository.workspace = true` to
# each of the fifteen member manifests. Inheriting a key the workspace does not
# define is a hard error, so the two halves move together or not at all.
# Resolved against the workspace root when inherited, so all twelve crates put
# the same front page on crates.io rather than each carrying a copy.
readme = "README.md"
# crates.io takes at most five keywords and two of these are the words somebody
# would actually search. The five slots go to the words a UI-framework seeker
# actually types, and the list stays honest — this is not a port of anything.
keywords = ["ui", "gui", "framework", "mobile"]
# Both are real crates.io slugs; an invalid one is refused at publish time, and
# the point of writing them now is that the first publish is not the first time
# any of this is checked.
categories = ["gui", "rendering"]

