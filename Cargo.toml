# Touch exploration on Android needs a winit that does not throw hover events
# away. `ci/tools/patch-winit.sh` vendors and patches one; uncommenting this is what
# makes the build use it.
#
# **Left commented on purpose.** A `[patch.crates-io]` rewires every build in
# this workspace including CI's, and a local deviation that nobody remembers
# making is exactly how a green run stops meaning what it says. Uncomment it,
# check by finger, and comment it back out — or delete both halves the day
# upstream takes the patch.
#
# [patch.crates-io]
# winit = { path = "vendor/winit" }

# A phone runs whatever profile the harness built. There was no `[profile]`
# section here at all, so both profiles were cargo's defaults and nothing in the
# tree recorded that the difference matters on a device — a debug build is the
# first thing to rule out when a phone reports lag, and it is worth roughly an
# order of magnitude.
#
# `panic` is deliberately left at the default `unwind`. **Do not set
# `panic = "abort"` here.** `ElementTree::build` wraps every `widget.build` in
# `catch_unwind` — that is the error boundary, and `deep_links.rs` notes its own
# `catch_unwind` as load-bearing. Aborting turns a contained widget failure into
# a killed process, which on a phone is a crash report instead of a red box.
[profile.release]
# One codegen unit per crate rather than sixteen. The cost is compile time on a
# cold build, paid once by CI and by whoever ships; the win lands on the device,
# where the frame budget is 16.6ms.
codegen-units = 1

# **LTO is off, and it is not an oversight — it cannot be on.**
#
# `rustc` refuses outright:
#
#     error: cannot prefer dynamic linking when performing LTO
#
# and `-C prefer-dynamic` is not optional here. It is what makes the studio and
# the preview `cdylib` it `dlopen`s share one `libstd`, which is what makes
# `catch_unwind` catch a panic raised inside somebody's screen instead of the
# process aborting — see `.cargo/config.toml`, which has the whole argument.
#
# So the two are a genuine either/or, and this is the side to be on: LTO is
# worth low single-digit percentages on frame cost, and the panic boundary is
# the difference between a red box in the preview pane and the window vanishing
# while somebody is working. `codegen-units = 1` still buys most of what LTO
# would inside each crate; what is given up is cross-crate inlining.
#
# Setting this to anything but `false` makes every release build fail to link,
# so the mistake is at least loud.
lto = false

# Line tables, not full debug info. A release profile with no debug info at all
# gives a device profile that is a wall of hex, and the work still ahead here is
# exactly the kind that needs to read one — the previous phone report resolved
# to per-frame CPU in layout and build, not to the GPU. Line tables are a few
# percent of binary size; full `debug = true` is multiples of it.
debug = "line-tables-only"

# Debug builds are painful mostly because the per-frame pixel work is
# unoptimised, and none of it is code anyone steps through. Optimising just
# that keeps the crates people actually debug — widgets, elements, the studio's
# own logic — fast to compile and readable in a debugger, while making a debug
# build merely slow rather than unusable.
#
# This does not make a debug build shippable. It makes one survivable.
#
# `"*"` covers every **non-workspace** dependency: the text stack, `png`,
# `ttf-parser`, winit.
[profile.dev.package."*"]
opt-level = 2

# **The rasterizer is ours now, and `"*"` above does not cover it.**
#
# That rule was written when the heavy per-frame work belonged to vello and
# wgpu — third-party crates, so `"*"` reached them. Both were removed:
# `vieww-paint`'s own scanline rasterizer is the renderer (see
# `docs/RENDERER-MIGRATION.md`), and it is a workspace member, so `"*"` skips
# it. Every debug build since has run the single hottest loop in the framework
# — coverage, blending, one pass per pixel of the window — with no
# optimisation at all.
#
# What that costs is not subtle and it is not theoretical: an unoptimised
# `NativeRenderer` turns a frame that takes single-digit milliseconds into one
# that takes seconds, which is a studio where clicking a sidebar icon appears
# to hang, an animation that plays two of its frames, and a splash screen that
# never fades. All three were reported from a debug build of `viewwstudio`, and
# all three are this line.
#
# Only the pixel-facing crates, deliberately. `vieww-widget`, `vieww-element`
# and the studio itself stay unoptimised, because those are where a breakpoint
# actually goes and where an inlined stack frame actually costs someone time.
[profile.dev.package.vieww-paint]
opt-level = 3
[profile.dev.package.vieww-text]
opt-level = 3
[profile.dev.package.vieww-effects]
opt-level = 3
[profile.dev.package.vieww-foundation]
# Geometry, colour and `Transform` — small functions called from inside the
# rasterizer's inner loops, where "not inlined" is the whole cost.
opt-level = 3
[profile.dev.package.vieww-scene]
opt-level = 2
[profile.dev.package.vieww-hal]
opt-level = 2

# **Share one `libstd` between the studio and the previews it loads.**
#
# `apps/viewwstudio` `dlopen`s a `cdylib` the preview compiles, then calls into
# widgets the cdylib produced. A `cdylib` statically links its own copy of
# `std`, so a panic raised inside guest code is a *foreign* exception to the
# host's unwinder — `catch_unwind` in the host does not catch it, and the
# process aborts with "fatal runtime error: Rust cannot catch foreign
# exceptions". See `apps/viewwstudio/src/loaded.rs`'s panic section for the
# full history.
#
# `panic = "unwind"` (preserved below) and `catch_unwind` in
# `ElementTree::build` are the host-side boundary; with both sides built
# `prefer-dynamic`, both link against `libstd-*.so` from the same toolchain,
# and the existing catch works for guest widgets too.
#
# **The cost:** a binary that depends on `libstd-*.so` being on the loader
# path at runtime. For a development checkout this is the toolchain's own
# `lib/` directory, which is already on `LD_LIBRARY_PATH` for `cargo run`.
# For a packaged studio, the packager has to ship `libstd.so` alongside the
# binary — see `packaging/package.sh`. A binary that does not find its
# `libstd` exits with a loader error rather than a missing-widget error, so
# a wrong package fails loud and early rather than silently.
#
# **Where this flag goes:** `prefer-dynamic` is a rustc `-C` flag, not a cargo
# profile key — cargo ignores `prefer-dynamic` under `[profile.*]` with only an
# "unused manifest key" warning. It has to be set as a rustflag, so it lives in
# `.cargo/config.toml`, scoped to the desktop triples the studio runs on (a
# plain `[build] rustflags` would reach an Android or iOS cross-build too, where
# a dynamic libstd is a link error against a file the NDK does not ship). It
# applies to dev and release both — the panic boundary has to hold on a release
# build too, since a release studio loading a release preview is what a packaged
# application runs. That file also carries the `-C rpath` that lets a binary
# find its `libstd` when it was started by anything other than cargo.


[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
doc_markdown = "allow"

# Broken in clippy 0.1.96 (rustc 1.96.1): it fires on initializers that are
# *already* `const`, so it asks for the thing that is written on the line it
# points at. Every `thread_local!` in this workspace that can be `const` already
# is — `frame.rs`, `sliver_refresh.rs`, `app.rs`, `gallery.rs` — and the one that
# cannot, `theme.rs`'s `Rc::new(ThemeData::light())`, is correctly left alone.
#
# Allowed workspace-wide rather than at the four sites because a lint that no
# edit can satisfy carries no signal anywhere, and four `#[allow]`s would each
# have to repeat this paragraph. **Delete this the next time the toolchain moves**
# and let the four sites prove the lint is honest again.
missing_const_for_thread_local = "allow"

# ── Lints the corrected MSRV switched on ──────────────────────────────────
#
# Clippy gates a lint on `rust-version`: it will not tell you to use an API your
# declared minimum cannot compile. While this workspace claimed 1.85 — a figure
# nothing could build on, see the note in `[workspace.package]` — every lint that
# suggests a 1.86-to-1.89 API was suppressed everywhere, silently. Correcting the
# figure to 1.89 turned all of them on at once.
#
# They are real suggestions, not false positives, and none of them changes
# behaviour. They are allowed here rather than applied because each is a *mass*
# edit to code that is worth reading carefully, and doing several of those in the
# same change as an MSRV correction is how a real defect hides in the diff.
#
# **Each is its own change, with the test suite as the check, and each entry
# below is deleted when its last call site is gone.**

# `slice::as_chunks`, stabilised in 1.88. **Seventeen** call sites, every one a
# per-pixel loop: `vieww-effects`' blend and matrix passes, `vieww-paint`'s
# target readback, `vieww-image`'s atlas and mipmap chains, `vieww-hal`'s
# swapchain copy.
#
# The rewrite is not the substitution the lint's `help` line offers.
# `as_chunks_mut::<4>()` returns a `(&mut [[u8; 4]], &mut [u8])` pair, so a
# `.zip()` over two of them changes shape as well as type, and the remainder
# slice becomes something the loop must use or explicitly discard. Seventeen of
# those, at once, in the code that writes every pixel this framework draws, on
# the strength of a style lint — that is how a subtle blend bug gets in. Do them
# against the parity and retained-repaint suites.
chunks_exact_to_as_chunks = "allow"

# `u*::is_multiple_of`, stabilised in 1.87 for unsigned integers. **Thirty-nine**
# `% n == 0` sites, spread across `vieww-foundation`'s leap-year rule and blur
# kernel sizing, `vieww-paint`'s dash phase, the studio's image budget, and a
# long tail of `index % 2 == 0` row striping in tests and gallery examples.
#
# `.is_multiple_of(n)` reads better than `% n == 0` and this list should shrink
# to nothing. It is one mechanical pass — but only over the *unsigned* sites,
# because the method does not exist for signed integers, and telling those apart
# is per-site work rather than a search and replace.
manual_is_multiple_of = "allow"
