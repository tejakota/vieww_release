[package]
name = "vieww-platform-web-dom"
description = "A DOM backend for vieww's web target: the same widget tree, painted by the browser."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vieww-foundation = { workspace = true }
vieww-widget = { workspace = true }
vieww-element = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "Node", "NodeList", "Text", "CssStyleDeclaration", "DomTokenList", "Event",
    "EventTarget", "MouseEvent", "console",
]
